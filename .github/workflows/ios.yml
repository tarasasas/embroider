name: Build iOS app (unsigned IPA for Sideloadly)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project Embroider.xcodeproj -scheme Embroider -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Embroider.app Payload/
          zip -qry Embroider.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Embroider-ipa
          path: ios/Embroider.ipa
